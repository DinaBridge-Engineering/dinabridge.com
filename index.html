<style>
/* ── Design tokens ── */
:root {
  --ink: oklch(0.16 0.008 260);
  --cream: oklch(0.955 0.012 85);
  --signal: oklch(0.78 0.16 65);
  --signal-fg: oklch(0.16 0.008 260);
  --card: oklch(0.19 0.008 260);
  --secondary: oklch(0.24 0.008 260);
  --muted-fg: oklch(0.68 0.012 260);
  --hairline: oklch(1 0 0 / 8%);
  --hairline-strong: oklch(1 0 0 / 16%);
  --radius: 0.5rem;
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
}

/* ── Reset / base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-color:var(--hairline)}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--ink);color:var(--cream);font-family:var(--font-sans);font-feature-settings:"ss01","cv11"}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-0.02em}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;background:none;border:none}
img,svg{display:block}
ul{list-style:none}

/* ── Layout utilities ── */
.cx{width:100%;max-width:1280px;margin-inline:auto;padding-inline:1.5rem}
@media(min-width:1024px){.cx{padding-inline:4rem}}

.section{padding-block:3rem}
@media(min-width:640px){.section{padding-block:4rem}}
@media(min-width:1024px){.section{padding-block:7rem}}

.section.cream{background:var(--cream);color:var(--ink)}
.section.cream .muted{color:oklch(0.42 0.008 260)}
.section.cream .hairline-border{border-color:oklch(0 0 0 / 10%)}
.section.cream .card-bg{background:#fff;border-color:oklch(0 0 0 / 18%)}

/* ── Typography ── */
.eyebrow{font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted-fg);font-weight:500}
.muted{color:var(--muted-fg)}

/* ── Buttons ── */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.4rem;border-radius:999px;background:var(--signal);color:var(--signal-fg);font-weight:600;font-size:.95rem;transition:filter 150ms,transform 150ms}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.4rem;border-radius:999px;border:1px solid var(--hairline-strong);color:inherit;font-weight:500;font-size:.95rem;transition:background 150ms,border-color 150ms}
.btn-ghost:hover{background:oklch(1 0 0 / 6%);border-color:oklch(1 0 0 / 40%)}
.btn-sm{padding:.5rem 1rem;font-size:.85rem}

/* ── Section head ── */
.section-head{max-width:700px;margin-bottom:0}
.section-head .title{margin-top:1.25rem;font-size:clamp(1.75rem,3.5vw,2.5rem);font-weight:600;line-height:1.1;letter-spacing:-0.02em}
.section-head .subtitle{margin-top:1rem;font-size:1rem;line-height:1.7;color:var(--muted-fg)}
.section.cream .section-head .subtitle{color:oklch(0.42 0.008 260)}

/* ════════════════ HEADER ════════════════ */
header{position:sticky;top:0;z-index:50;border-bottom:1px solid transparent;background:var(--ink);transition:background 200ms,border-color 200ms}
header.scrolled{background:oklch(0.16 0.008 260 / 85%);backdrop-filter:blur(12px);border-color:var(--hairline)}
.header-inner{display:flex;height:4rem;align-items:center;justify-content:space-between;gap:1.5rem}

/* Logo */
.logo{font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:-0.03em;color:var(--cream)}
.logo span{color:var(--signal)}

/* Desktop nav */
.desktop-nav{display:none;align-items:center;gap:.25rem}
@media(min-width:1024px){.desktop-nav{display:flex}}
.nav-link{position:relative;padding:.5rem .75rem;border-radius:.375rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 80%);transition:color 150ms}
.nav-link:hover,.nav-link.active{color:var(--cream)}
.nav-link::after{content:'';position:absolute;left:.75rem;right:.75rem;bottom:.25rem;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform 200ms}
.nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}

/* Dropdown */
.dropdown{position:relative}
.dropdown-btn{display:flex;align-items:center;gap:.25rem;padding:.5rem .75rem;border-radius:.375rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 80%);transition:color 150ms}
.dropdown-btn:hover{color:var(--cream)}
.dropdown-btn svg{width:14px;height:14px;opacity:.6}
.dropdown-panel{display:none;position:absolute;left:0;top:100%;margin-top:.25rem;min-width:180px;border-radius:.5rem;border:1px solid var(--hairline);background:var(--card);padding:.375rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
.dropdown:hover .dropdown-panel,.dropdown-panel:hover{display:block}
.dropdown-item{display:block;padding:.5rem .75rem;border-radius:.375rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 80%);transition:background 150ms,color 150ms}
.dropdown-item:hover{background:var(--secondary);color:var(--cream)}

/* Header CTA */
.header-cta{display:none}
@media(min-width:1024px){.header-cta{display:inline-flex}}

/* Mobile toggle */
.menu-btn{display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border-radius:.375rem;border:1px solid var(--hairline);color:var(--cream)}
@media(min-width:1024px){.menu-btn{display:none}}

/* Mobile nav drawer */
.mobile-nav{display:none;border-top:1px solid var(--hairline);background:var(--ink)}
.mobile-nav.open{display:block}
.mobile-nav-inner{padding:1rem 0;display:flex;flex-direction:column;gap:.25rem}
.mobile-link{padding:.75rem;border-radius:.375rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 85%);display:block;transition:background 150ms}
.mobile-link:hover{background:var(--secondary)}
.mobile-dropdown-btn{display:flex;width:100%;align-items:center;justify-content:space-between;padding:.75rem;border-radius:.375rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 85%);transition:background 150ms}
.mobile-dropdown-btn:hover{background:var(--secondary)}
.mobile-dropdown-btn svg{width:16px;height:16px;transition:transform 200ms}
.mobile-dropdown-btn.open svg{transform:rotate(180deg)}
.mobile-sub{margin-left:.75rem;border-left:1px solid var(--hairline);padding-left:.75rem;display:none;flex-direction:column}
.mobile-sub.open{display:flex}

/* ════════════════ HERO ════════════════ */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--hairline)}
.hero-glow{pointer-events:none;position:absolute;inset:0;opacity:.7}
.hero-glow::before{content:'';position:absolute;top:-10rem;left:50%;transform:translateX(-50%);width:880px;height:520px;border-radius:50%;filter:blur(80px);background:radial-gradient(closest-side,oklch(0.78 0.16 65 / 22%),transparent 70%)}
.hero-grid{pointer-events:none;position:absolute;inset:0;opacity:.035;background-image:linear-gradient(var(--cream) 1px,transparent 1px),linear-gradient(90deg,var(--cream) 1px,transparent 1px);background-size:56px 56px}
.hero-content{position:relative;padding-top:5rem;padding-bottom:5rem}
@media(min-width:1024px){.hero-content{padding-top:8rem;padding-bottom:8rem}}
.hero-eyebrow{font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted-fg);font-weight:500}
.hero-h1{margin-top:1.5rem;font-size:clamp(2.2rem,6vw,4.5rem);font-weight:600;line-height:1.02;letter-spacing:-0.02em;max-width:900px}
.hero-rotate{display:inline-block;color:var(--signal);position:relative}
@keyframes rotateWord{0%{opacity:0;transform:translateY(12px);filter:blur(4px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
.hero-lead{margin-top:1.75rem;max-width:640px;font-size:clamp(1rem,1.5vw,1.125rem);line-height:1.7;color:oklch(0.955 0.012 85 / 70%)}
.hero-actions{margin-top:2.25rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}

/* ════════════════ INFRASTRUCTURE TOPOLOGY ════════════════ */
.hero .hero-layout{display:grid;grid-template-columns:1fr;gap:2.5rem;align-items:center}
@media(min-width:900px){.hero .hero-layout{grid-template-columns:56fr 44fr;gap:2rem}}
.hero .hero-text{min-width:0}
.infrastructure-topology{display:flex;align-items:center;justify-content:center;width:100%;max-width:460px;margin-inline:auto}
@media(min-width:900px){.infrastructure-topology{max-width:360px;margin-inline:0}}
@media(min-width:1024px){.infrastructure-topology{max-width:100%}}
.infrastructure-topology .infra-topo-diagram{width:100%;height:auto;overflow:visible}
.infrastructure-topology .infra-topo-status-dot{animation:infra-topo-pulse 2s ease-in-out infinite}
@keyframes infra-topo-pulse{0%,100%{opacity:1;r:3.5px}50%{opacity:.45;r:5px}}
.infrastructure-topology .infra-topo-particle{display:block}
.infrastructure-topology .infra-topo-rm-dot{display:none}
@media(prefers-reduced-motion:reduce){
  .infrastructure-topology .infra-topo-particle{display:none}
  .infrastructure-topology .infra-topo-rm-dot{display:block}
  .infrastructure-topology .infra-topo-status-dot{animation:none}
}

/* ════════════════ LOGO STRIP ════════════════ */
.logo-strip{border-bottom:1px solid var(--hairline)}
.logo-strip-inner{padding-block:2.5rem}
.logo-grid{margin-top:1.5rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem 1.5rem}
@media(min-width:640px){.logo-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){.logo-grid{grid-template-columns:repeat(6,1fr)}}
.logo-item{display:flex;align-items:center;gap:.5rem;color:oklch(0.955 0.012 85 / 55%);transition:color 200ms}
.logo-item:hover{color:oklch(0.955 0.012 85 / 85%)}
.logo-dot{flex-shrink:0;width:6px;height:6px;border-radius:50%;background:oklch(0.78 0.16 65 / 70%)}
.logo-name{font-family:var(--font-display);font-size:clamp(.85rem,1.2vw,1rem);font-weight:500;letter-spacing:-0.02em}
.logo-strip-link{margin-top:1.5rem;display:inline-flex;align-items:center;gap:.5rem;font-size:.75rem;font-family:var(--font-mono);color:var(--signal)}
.logo-strip-link:hover{text-decoration:underline;text-underline-offset:4px}
.logo-strip-link svg{width:14px;height:14px}

/* ════════════════ DISCIPLINE CARDS ════════════════ */
.discipline-grid{margin-top:3.5rem;display:grid;gap:1.25rem}
@media(min-width:1024px){.discipline-grid{grid-template-columns:repeat(3,1fr)}}
.discipline-card{position:relative;border-radius:.75rem;border:1px solid var(--hairline-strong);background:var(--card);padding:1.75rem;transition:transform 200ms,box-shadow 200ms}
.discipline-card:hover{transform:translateY(-4px);box-shadow:0 20px 60px -30px rgba(0,0,0,.35)}
.discipline-card-top{display:flex;align-items:center;justify-content:space-between}
.discipline-card-num{font-family:var(--font-mono);font-size:.75rem;color:var(--muted-fg)}
.discipline-card-icon{width:20px;height:20px;color:var(--signal)}
.discipline-card-title{margin-top:1.5rem;font-family:var(--font-display);font-size:1.5rem;font-weight:600;letter-spacing:-0.02em}
.discipline-tag{margin-top:.5rem;display:inline-block;font-family:var(--font-mono);font-size:.625rem;text-transform:uppercase;letter-spacing:.1em;color:var(--signal);border:1px solid oklch(0.78 0.16 65 / 40%);padding:.2rem .5rem;border-radius:.25rem}
.discipline-stack{margin-top:.75rem;font-family:var(--font-mono);font-size:.75rem;color:var(--muted-fg)}
.discipline-bullets{margin-top:1.5rem;border-top:1px solid var(--hairline);padding-top:1.25rem;display:flex;flex-direction:column;gap:.625rem}
.discipline-bullets li{display:flex;align-items:flex-start;gap:.75rem;font-size:.875rem}
.bullet-bar{flex-shrink:0;margin-top:.375rem;width:.75rem;height:.25rem;background:var(--signal)}

/* ════════════════ VECTOR CALLOUT ════════════════ */
.vector-callout{border-radius:1rem;border:1px solid var(--hairline-strong);background:var(--card);padding:2rem;display:grid;gap:2rem}
@media(min-width:1024px){.vector-callout{grid-template-columns:auto 1fr auto;align-items:center;padding:3rem}}
.vector-icon{width:3.5rem;height:3.5rem;border-radius:.75rem;background:oklch(0.78 0.16 65 / 10%);border:1px solid oklch(0.78 0.16 65 / 30%);display:grid;place-items:center}
.vector-icon svg{width:1.5rem;height:1.5rem;color:var(--signal)}
.vector-title{margin-top:.75rem;font-family:var(--font-display);font-size:clamp(1.25rem,2.5vw,1.875rem);font-weight:600;letter-spacing:-0.02em}
.vector-body{margin-top:1rem;color:oklch(0.955 0.012 85 / 70%);line-height:1.7;max-width:640px}

/* ════════════════ ENGAGEMENT MODELS ════════════════ */
.models-grid{margin-top:3.5rem;display:grid;gap:1px;background:var(--hairline);border-radius:.75rem;overflow:hidden;border:1px solid var(--hairline)}
@media(min-width:1024px){.models-grid{grid-template-columns:repeat(3,1fr)}}
.model-cell{background:var(--ink);padding:2rem}
@media(min-width:1024px){.model-cell{padding:2.5rem}}
.model-cell-top{display:flex;align-items:center;gap:.75rem}
.model-num{font-family:var(--font-mono);font-size:.75rem;color:var(--signal)}
.model-title{margin-top:1.5rem;font-family:var(--font-display);font-size:1.5rem;font-weight:600;letter-spacing:-0.02em}
.model-body{margin-top:1rem;color:oklch(0.955 0.012 85 / 70%);line-height:1.7}

/* ════════════════ PROCESS ════════════════ */
.process-grid{margin-top:3.5rem;display:grid;gap:1.5rem}
@media(min-width:640px){.process-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.process-grid{grid-template-columns:repeat(4,1fr)}}
.process-step{position:relative}
.process-num{font-family:var(--font-mono);font-size:.75rem;color:var(--muted-fg)}
.section.cream .process-num{color:oklch(0.42 0.008 260)}
.process-line{margin-top:1rem;height:1px;background:oklch(0 0 0 / 18%);position:relative}
.section:not(.cream) .process-line{background:var(--hairline-strong)}
.process-dot{position:absolute;top:-4px;left:0;width:8px;height:8px;background:var(--signal)}
.process-title{margin-top:1.5rem;font-family:var(--font-display);font-size:1.25rem;font-weight:600;letter-spacing:-0.02em}
.process-body{margin-top:.75rem;font-size:.875rem;color:var(--muted-fg);line-height:1.7}
.section.cream .process-body{color:oklch(0.42 0.008 260)}

/* ════════════════ AUDIENCES ════════════════ */
.audience-grid{margin-top:3.5rem;display:grid;gap:1.25rem}
@media(min-width:640px){.audience-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.audience-grid{grid-template-columns:repeat(4,1fr)}}
.audience-card{border-radius:.75rem;border:1px solid var(--hairline);padding:1.5rem;transition:border-color 150ms,background 150ms}
.audience-card:hover{border-color:var(--hairline-strong);background:var(--card)}
.audience-icon{width:20px;height:20px;color:var(--signal)}
.audience-title{margin-top:1.5rem;font-family:var(--font-display);font-size:1.125rem;font-weight:600;letter-spacing:-0.02em}
.audience-body{margin-top:.75rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 65%);line-height:1.7}

/* ════════════════ ASSESSMENT CTA ════════════════ */
.assessment-card{border-radius:1rem;border:1px solid var(--hairline-strong);background:var(--ink);color:var(--cream);padding:2rem;display:flex;flex-direction:column;gap:2rem}
@media(min-width:1024px){.assessment-card{flex-direction:row;align-items:center;justify-content:space-between;padding:3.5rem}}
.assessment-title{margin-top:1.25rem;font-family:var(--font-display);font-size:clamp(1.25rem,2.5vw,1.875rem);line-height:1.2;letter-spacing:-0.02em}

/* ════════════════ FAQ ════════════════ */
.faq-list{margin-top:3rem;max-width:48rem;border-top:1px solid var(--hairline-strong);border-bottom:1px solid var(--hairline-strong)}
.section.cream .faq-list{border-color:oklch(0 0 0 / 18%)}
.faq-item{border-bottom:1px solid var(--hairline-strong)}
.section.cream .faq-item{border-color:oklch(0 0 0 / 18%)}
.faq-item:last-child{border-bottom:none}
.faq-btn{display:flex;width:100%;align-items:flex-start;justify-content:space-between;gap:1.5rem;padding:1.25rem 0;t
