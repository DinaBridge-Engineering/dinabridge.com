  --ink: oklch(0.16 0.008 260);

  --card: oklch(0.19 0.008 260);
  --secondary: oklch(0.24 0.008 260);
  --muted-fg: oklch(0.68 0.012 260);
  --hairline: oklch(1 0 0 / 8%);
  --hairline-strong: oklch(1 0 0 / 16%);
  --radius: 0.5rem;
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-color:var(--hairline)}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:var(--ink);color:var(--cream);font-family:var(--font-sans);font-feature-settings:"ss01","cv11"}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-0.02em}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;background:none;border:none}
img,svg{display:block}
ul{list-style:none}

/* ── Layout utilities ── */
.cx{width:100%;max-width:1280px;margin-inline:auto;padding-inline:1.5rem}

@media(min-width:640px){.section{padding-block:4rem}}

.section.cream{background:var(--cream);color:var(--ink)}
.section.cream .muted{color:oklch(0.42 0.008 260)}
.section.cream .hairline-border{border-color:oklch(0 0 0 / 10%)}
.section.cream .card-bg{background:#fff;border-color:oklch(0 0 0 / 18%)}

/* ── Typography ── */
.eyebrow{font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted-fg);font-weight:500}

/* ── Buttons ── */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.4rem;border-radius:999px;background:var(--signal);color:var(--signal-fg);font-weight:600;font-size:.95rem;transition:filter 150ms,transform 150ms}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.4rem;border-radius:999px;border:1px solid var(--hairline-strong);color:inherit;font-weight:500;font-size:.95rem;transition:background 150ms,border-color 150ms}
.btn-ghost:hover{background:oklch(1 0 0 / 6%);border-color:oklch(1 0 0 / 40%)}
.btn-sm{padding:.5rem 1rem;font-size:.85rem}

/* ── Section head ── */
.section-head{max-width:700px;margin-bottom:0}
.section-head .title{margin-top:1.25rem;font-size:clamp(1.75rem,3.5vw,2.5rem);font-weight:600;line-height:1.1;letter-spacing:-0.02em}
.section-head .subtitle{margin-top:1rem;font-size:1rem;line-height:1.7;color:var(--muted-fg)}
.section.cream .section-head .subtitle{color:oklch(0.42 0.008 260)}

/* ════════════════ HEADER ════════════════ */
header{position:sticky;top:0;z-index:50;border-bottom:1px solid transparent;background:var(--ink);transition:background 200ms,border-color 200ms}
header.scrolled{background:oklch(0.16 0.008 260 / 85%);backdrop-filter:blur(12px);border-color:var(--hairline)}
.header-inner{display:flex;height:4rem;align-items:center;justify-content:space-between;gap:1.5rem}

/* Logo */
.logo{font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:-0.03em;color:var(--cream)}
.logo span{color:var(--signal)}

/* Desktop nav */
.desktop-nav{display:none;align-items:center;gap:.25rem}
@media(min-width:1024px){.desktop-nav{display:flex}}
.nav-link{position:relative;padding:.5rem .75rem;border-radius:.375rem;font-size:.875rem;color:oklch(0.955 0.012 85 / 80%);transition:color 150ms}
.nav-link:hover,.nav-link.active{color:var(--cream)}
.nav-link::after{content:'';position:absolute;left:.75rem;right:.75rem;bottom:.25rem;height:1px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform 200ms}
.nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}
